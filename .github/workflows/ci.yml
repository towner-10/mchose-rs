name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy (core, cli)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Lint only the crates that do not pull in gpui, so this stays fast.
      - run: cargo clippy -p mchose-core -p mchose-cli --all-targets --locked -- -D warnings

  cli:
    name: build cli
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p mchose-cli --release --locked
      - name: Test
        run: cargo test -p mchose-core -p mchose-cli --locked
      - name: Smoke test
        run: |
          ./target/release/mchose --version
          ./target/release/mchose --help

  gui:
    name: build gui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config \
            libvulkan-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libxcb-shm0-dev libxcb-keysyms1-dev libxcb-cursor-dev \
            libfontconfig1-dev libfreetype6-dev \
            libssl-dev
      - run: cargo build -p mchose-gui --locked
